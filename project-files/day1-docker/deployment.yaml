apiVersion: apps/v1
kind: Deployment
metadata:
  name: day1-app
  labels:
    app: day1-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: day1-app
  template:
    metadata:
      labels:
        app: day1-app
    spec:
      containers:
      - name: web
        image: day1-app:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: PORT
          value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: day1-service
spec:
  type: ClusterIP
  selector:
    app: day1-app
  ports:
  - port: 80
    targetPort: 3000